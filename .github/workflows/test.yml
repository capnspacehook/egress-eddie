name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  race-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: capnspacehook/cache-go/restore@v2.0.2

      # the test is compiled and run as root so that egress eddie can
      # open nfqueues, which is a privileged operation
      - run: |
          go test -c -race -o egress-eddie.test
          sudo ./egress-eddie.test -enable-ipv6=false -test.timeout 5m -test.v -test.run TestIntegration

          go test -race -timeout 10m -v -rapid.checks 100_000 ./...

      - name: Save Go cache
        if: always()
        uses: capnspacehook/cache-go/save@v2.0.2

  binary-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: capnspacehook/cache-go/restore@v2.0.2

      # run the same tests as above but use a binary to process packets
      # to test with landlock and seccomp filters active
      - name: Run binary tests
        run: |
          set +e

          CGO_ENABLED=0 go build -o ./egress-eddie ./cmd/egress-eddie
          go test -c -o egress-eddie.test
          sudo ./egress-eddie.test -binary-tests -enable-ipv6=false -test.timeout 5m -test.v -test.run TestIntegration

      - name: Save Go cache
        if: always()
        uses: capnspacehook/cache-go/save@v2.0.2

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: capnspacehook/cache-go/restore@v2.0.2
        with:
          cache-fuzz-corpus: true

      - run: |
          go test -fuzz FuzzVerdicts -run N/A -fuzztime 10m

      - name: Save Go cache
        if: always()
        uses: capnspacehook/cache-go/save@v2.0.2
        with:
          cache-fuzz-corpus: true
